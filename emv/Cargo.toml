[package]
name = "emv"
version = "0.1.0"
resolver = "3"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Anjan Roy <hello@itzmeanjan.in>"]
description = "Prove and verify, in zero knowledge, that a genuine EMV contactless card signed a verifier's nonce"
publish = false

[dependencies]
anyhow = "=1.0.104"
getrandom = "=0.4.3"
provekit-common = "=1.0.2"
provekit-prover = "=1.0.2"
provekit-r1cs-compiler = "=1.0.2"
provekit-verifier = "=1.0.2"
noirc_abi = { package = "provekit_noirc_abi", version = "=1.0.0-beta.26" }
noirc_artifacts = { package = "provekit_noirc_artifacts", version = "=1.0.0-beta.26" }
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
serde_json = "=1.0.151"
thiserror = "=2.0.21"

[dev-dependencies]
const-hex = "=1.19.3"
criterion = "=0.8.2"
sha1 = "=0.11.0"

[[bench]]
name = "prove_verify"
harness = false

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "forbid"
# Not forbid: thiserror's derive allows it.
unused_qualifications = "deny"
rust_2018_idioms = { level = "forbid", priority = -1 }

[lints.clippy]
# Not forbid: thiserror's derive allows one of its lints.
pedantic = { level = "deny", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
as_conversions = "forbid"
dbg_macro = "forbid"

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "fat"

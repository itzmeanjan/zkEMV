name: zkEMV CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

# One run per pull request or branch: a new commit cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NARGO_VERSION: 1.0.0-beta.26

jobs:
  python:
    name: Python lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make lint-python
      - run: make format-check-python

  circuits:
    name: Noir tests and format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: ${{ env.NARGO_VERSION }}
      - run: make format-check-noir
      - run: make test-circuits

  rust:
    name: Rust ${{ matrix.name }} (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msrv
            rust: "1.90"
            source: emv/Cargo.toml
            key: rust-version
          - name: development
            rust: "1.98.0"
            source: emv/rust-toolchain.toml
            key: channel
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Matrix matches ${{ matrix.source }}
        run: grep -Fqx '${{ matrix.key }} = "${{ matrix.rust }}"' ${{ matrix.source }}
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: ${{ env.NARGO_VERSION }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: emv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make format-check-rust
      - run: make lint-rust
      - run: make test-e2e
